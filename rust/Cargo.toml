[package]
name = "vynkor-agent-core"
version = "0.1.0"
edition = "2021"
description = "Rust core of the vynkor Android device-agent: protocol engine (framing, frame-MAC, WS, registration) behind a UniFFI boundary"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
# cdylib -> the .so the Android app loads; lib -> host-side unit tests.

[dependencies]
# UniFFI bindings generator: proc-macro exports (`#[uniffi::export]`) +
# `setup_scaffolding!()`. Kotlin bindings generated at build time.
uniffi = { version = "0.32", features = ["cli"] }
# 0.0.3 = proto v1.6: device identity (DeviceOs::Android), audio stream,
# tool schema. All framing/MAC/protobuf types come from here, verbatim.
vynkor-wire = "0.0.3"
# Message trait for Envelope encode/decode.
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# WS client, mirrors the kernel D-06 bridge; rustls-tls-webpki-roots for wss://.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Pin the host's self-signed cert (carried via the pairing QR) so wss:// works
# without falling back to tls:false.
rustls = "0.23"
rustls-pemfile = "2"
futures-util = "0.3"
url = "2"
crc32fast = "1"
serde_json = "1"
tracing = "0.1"
# Android: tracing events have no default writer — the tracing-android layer
# routes them to logcat (adb logcat shows the agent's protocol logs).
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
thiserror = "2"
opus = "0.3"
rtrb = "0.3"
ringbuf = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[patch.crates-io]
vynkor-wire = { path = "../../vynkor-wire" }
