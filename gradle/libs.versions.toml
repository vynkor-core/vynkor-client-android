# R-32: single source of truth for dependency versions.
# Versions pinned to the previously inlined values; bumping is a separate
# change (needs network + smoke, especially coroutines — it feeds the Rust
# UniFFI bridge).

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
jna = "5.15.0"
markwon = "4.6.2"
core-ktx = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
recyclerview = "1.3.2"
lifecycle = "2.11.0"
activity = "1.13.0"
coroutines = "1.8.1"
zxing = "4.3.0"
biometric = "1.1.0"
prism4j-bundler = "2.0.0"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.6.1"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-tables = { module = "io.noties.markwon:ext-tables", version.ref = "markwon" }
markwon-ext-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
markwon-linkify = { module = "io.noties.markwon:linkify", version.ref = "markwon" }
markwon-syntax-highlight = { module = "io.noties.markwon:syntax-highlight", version.ref = "markwon" }
prism4j-bundler = { module = "io.noties:prism4j-bundler", version.ref = "prism4j-bundler" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# AGP 9 built-in Kotlin: kapt comes from AGP, not KGP.
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
